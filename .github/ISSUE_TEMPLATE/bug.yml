name: Bug report
description: Report a real bug to diagnose and fix
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: "1. Open movie\n2. Select seat\n3. Observe error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
    validations:
      required: true
